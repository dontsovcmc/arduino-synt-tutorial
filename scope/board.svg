<text x="82" y="407.0" font-size="13">провод: вставить в отверстие с обратной стороны и пропаять</text>
<text x="40" y="432.0" font-size="13" fill="#555">Ряд B — сигнал, ряд C — общая земля, ряды A и D свободны (можно отрезать).</text>
<text x="40" y="452.0" font-size="13" fill="#555">Между отверстиями 1–2, 4–5 и 8–9 ряда B перемычек НЕТ: там стоят R1, R2, C3. C3 керамический — полярность не важна.</text>
