<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Анализатор звука</title>
<style>
:root {
  --bg: #0c0e11;
  --panel: #14171c;
  --inset: #0f1115;
  --line: #252a32;
  --grid: rgba(255,255,255,0.07);
  --text: #d9dee6;
  --muted: #7d8794;
  --accent: #4fd1c5;
  --peak: #f6ad55;
  --bad: #f56565;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 -apple-system, system-ui, "Segoe UI", sans-serif; }

header {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
  padding: 10px 16px; border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 5; background: var(--bg);
}
h1 { font-size: 15px; font-weight: 600; margin: 0 6px 0 0; }
label { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
select, input, button {
  font: inherit; font-size: 13px; color: var(--text); background: var(--panel);
  border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px;
}
input[type=number] { width: 62px; }
select#dev { max-width: 240px; }
button { cursor: pointer; }
button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); border-color: var(--accent); color: #062420; font-weight: 600; }
button[aria-pressed="true"] { border-color: var(--peak); color: var(--peak); }
.spacer { flex: 1; }
#status { font: 12px var(--mono); color: var(--muted); }

#msg { margin: 12px 16px 0; padding: 10px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); display: none; }
#msg.show { display: block; }
#msg.err { border-color: var(--bad); color: #ffd0d0; }

main { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 12px 16px 24px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px 10px; min-width: 0; }
.panel h2 {
  margin: 0 0 6px; font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase;
  color: var(--muted); display: flex; justify-content: space-between; gap: 8px;
}
.panel h2 span { font: 11px var(--mono); text-transform: none; letter-spacing: 0; }
.wide { grid-column: 1 / -1; }
.plot { position: relative; width: 100%; background: var(--inset); border-radius: 4px; overflow: hidden; }
.plot canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.h340 { height: 340px; } .h200 { height: 200px; } .h130 { height: 130px; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.stat { background: var(--inset); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
.stat .k { font-size: 11px; color: var(--muted); }
.stat .v { font: 600 20px var(--mono); white-space: nowrap; }
.stat .u { font-size: 12px; color: var(--muted); margin-left: 3px; font-weight: 400; }

.meters { display: grid; grid-template-columns: 44px 1fr 72px; gap: 6px 8px; align-items: center; margin-bottom: 10px; font-size: 12px; }
.meters .name { color: var(--muted); }
.meters .val { font: 13px var(--mono); text-align: right; }
.bar { position: relative; height: 14px; background: var(--inset); border-radius: 3px; overflow: hidden; }
.bar .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, #2c9c90, var(--accent) 70%, var(--peak) 90%, var(--bad)); }
.bar .hold { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--text); left: 0; }
#clip { font: 600 11px var(--mono); padding: 2px 6px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); }
#clip.on { background: var(--bad); border-color: var(--bad); color: #fff; }

.tuner { display: flex; align-items: baseline; gap: 14px; margin-bottom: 8px; flex-wrap: wrap; }
#note { font: 700 34px var(--mono); min-width: 2.6em; }
#cents { font: 600 16px var(--mono); }
#hz { font: 16px var(--mono); color: var(--muted); }
.needle { position: relative; height: 8px; background: var(--inset); border-radius: 4px; margin-bottom: 10px; }
.needle::before { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--muted); }
.needle i { position: absolute; top: 0; bottom: 0; width: 6px; margin-left: -3px; border-radius: 3px; background: var(--accent); left: 50%; transition: left .08s linear; }

@media (max-width: 820px) {
  main { grid-template-columns: 1fr; }
  .h340 { height: 260px; }
}
</style>
</head>
<body>
<header>
  <h1>Анализатор звука</h1>
  <label>Вход <select id="dev"><option value="">по умолчанию</option></select></label>
  <button id="start" class="primary">Старт</button>
  <button id="test" title="Встроенный тестовый сигнал без микрофона">Тест-сигнал</button>
  <button id="freeze" aria-pressed="false" title="Пробел">Пауза</button>
  <label>БПФ
    <select id="fft">
      <option>1024</option><option>2048</option><option selected>4096</option><option>8192</option><option>16384</option>
    </select>
  </label>
  <label>Шкала
    <select id="scale"><option value="log" selected>лог</option><option value="lin">линейная</option></select>
  </label>
  <label>до
    <select id="fmax">
      <option value="4000">4 кГц</option><option value="8000">8 кГц</option>
      <option value="12000" selected>12 кГц</option><option value="24000">Найквист</option>
    </select>
  </label>
  <label>дБ <input id="dbmin" type="number" value="-110" step="5"> … <input id="dbmax" type="number" value="-20" step="5"></label>
  <button id="shot">PNG</button>
  <div class="spacer"></div>
  <div id="status">остановлено</div>
</header>

<div id="msg"></div>

<main>
  <section class="panel wide">
    <h2>Спектрограмма <span id="specInfo"></span></h2>
    <div class="plot h340"><canvas id="spec"></canvas><canvas id="specAxes"></canvas></div>
  </section>

  <section class="panel">
    <h2>Спектр <span>оранжевый — удержание пиков</span></h2>
    <div class="plot h200"><canvas id="spectrum"></canvas></div>
  </section>

  <section class="panel">
    <h2>Осциллограмма <span id="scopeInfo"></span></h2>
    <div class="plot h200"><canvas id="scope"></canvas></div>
  </section>

  <section class="panel">
    <h2>Уровень <span id="clip">CLIP</span></h2>
    <div class="meters">
      <div class="name">RMS</div><div class="bar"><div class="fill" id="rmsFill"></div><div class="hold" id="rmsHold"></div></div><div class="val" id="rmsVal">—</div>
      <div class="name">Пик</div><div class="bar"><div class="fill" id="pkFill"></div><div class="hold" id="pkHold"></div></div><div class="val" id="pkVal">—</div>
    </div>
    <div class="plot h130"><canvas id="levelHist"></canvas></div>
  </section>

  <section class="panel">
    <h2>Основной тон <span>YIN, 60–2000 Гц</span></h2>
    <div class="tuner"><div id="note">—</div><div id="cents"></div><div id="hz"></div></div>
    <div class="needle"><i id="needle"></i></div>
    <div class="plot h130"><canvas id="pitchHist"></canvas></div>
  </section>

  <section class="panel wide">
    <div class="stats">
      <div class="stat"><div class="k">Доминирующая частота</div><div class="v" id="sDom">—</div></div>
      <div class="stat"><div class="k">Спектральный центроид (яркость)</div><div class="v" id="sCent">—</div></div>
      <div class="stat"><div class="k">Пересечения нуля</div><div class="v" id="sZcr">—</div></div>
      <div class="stat"><div class="k">Постоянная составляющая</div><div class="v" id="sDc">—</div></div>
      <div class="stat"><div class="k">Частота дискретизации</div><div class="v" id="sSr">—</div></div>
      <div class="stat"><div class="k">Разрешение БПФ</div><div class="v" id="sRes">—</div></div>
    </div>
  </section>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);

// ---------- состояние ----------
let ac = null, analyser = null, sink = null, srcNode = null, stream = null, testNodes = [];
let timeBuf = null, freqBuf = null, peakSpec = null;
let mode = null;              // null | "mic" | "test"
let frozen = false;
let logScale = true, fMaxUser = 12000, dbMin = -110, dbMax = -20;

const FMIN_LOG = 40;
const GATE_DB = -60;          // ниже этого RMS сигнал считаем тишиной
const HIST_RATE = 50;         // точек в секунду в графиках истории
const HIST_LEN = 500;         // 10 секунд
const SPEC_RATE = 60;         // столбцов спектрограммы в секунду
const levelHist = new Float32Array(HIST_LEN).fill(-120);
const pitchHist = new Float32Array(HIST_LEN).fill(0);
let histPos = 0, lastHist = 0, lastSpec = 0;
let rmsHoldDb = -120, pkHoldDb = -120, clipUntil = 0;
let scopeGain = 1;
let cur = { rmsDb: -120, pkDb: -120, pitch: 0 };

// ---------- цветовая карта (inferno-подобная) ----------
const LUT = (() => {
  const stops = [[0,0,4],[31,12,72],[85,15,109],[136,34,106],[186,54,85],[227,89,51],[249,140,10],[249,201,50],[252,255,164]];
  const lut = new Uint8ClampedArray(256 * 3);
  for (let i = 0; i < 256; i++) {
    const t = i / 255 * (stops.length - 1), k = Math.min(stops.length - 2, Math.floor(t)), f = t - k;
    for (let c = 0; c < 3; c++) lut[i*3+c] = stops[k][c] + (stops[k+1][c] - stops[k][c]) * f;
  }
  return lut;
})();

// ---------- утилиты ----------
const dpr = () => window.devicePixelRatio || 1;
function fit(c) {
  const r = c.getBoundingClientRect(), d = dpr();
  const w = Math.max(1, Math.round(r.width * d)), h = Math.max(1, Math.round(r.height * d));
  if (c.width !== w || c.height !== h) { c.width = w; c.height = h; return true; }
  return false;
}
const sr = () => (ac ? ac.sampleRate : 48000);
const fMax = () => Math.min(fMaxUser, sr() / 2);
const fLo = () => (logScale ? FMIN_LOG : 0);
function fToN(f) {
  const lo = fLo(), hi = fMax();
  return logScale ? Math.log(f / lo) / Math.log(hi / lo) : (f - lo) / (hi - lo);
}
function nToF(n) {
  const lo = fLo(), hi = fMax();
  return logScale ? lo * Math.pow(hi / lo, n) : lo + (hi - lo) * n;
}
function fmtHz(f) {
  if (!f) return "—";
  return f >= 1000 ? (f / 1000).toFixed(f >= 10000 ? 1 : 2) + '<span class="u">кГц</span>'
                   : f.toFixed(f < 100 ? 1 : 0) + '<span class="u">Гц</span>';
}
function freqTicks() {
  const hi = fMax();
  if (logScale) return [50,100,200,500,1000,2000,5000,10000,20000].filter(f => f >= fLo() && f <= hi);
  const step = hi > 10000 ? 2000 : hi > 5000 ? 1000 : 500;
  const t = []; for (let f = step; f < hi; f += step) t.push(f); return t;
}
const tickLabel = (f) => (f >= 1000 ? f / 1000 + "k" : String(f));
const NOTES = ["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B"];
function showMsg(html, err) {
  const m = $("msg"); m.innerHTML = html || ""; m.className = html ? "show" + (err ? " err" : "") : "";
}

// ---------- аудио ----------
function ensureContext() {
  if (!ac) {
    ac = new AudioContext({ latencyHint: "interactive" });
    analyser = ac.createAnalyser();
    analyser.smoothingTimeConstant = 0;
    analyser.minDecibels = -140; analyser.maxDecibels = 0;
    // Анализатор подключаем к выходу через нулевое усиление: так граф гарантированно работает,
    // а в динамики ничего не идёт (нет обратной связи с микрофоном).
    sink = ac.createGain(); sink.gain.value = 0;
    analyser.connect(sink).connect(ac.destination);
    setFft(+$("fft").value);
  }
  return ac.resume();
}
function setFft(n) {
  if (!analyser) return;
  analyser.fftSize = n;
  timeBuf = new Float32Array(n);
  freqBuf = new Float32Array(n / 2);
  peakSpec = new Float32Array(n / 2).fill(-200);
  specMap = null;
  updateStatus();
}
function disconnectSources() {
  if (srcNode) { srcNode.disconnect(); srcNode = null; }
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  testNodes.forEach(n => { try { n.stop && n.stop(); } catch (e) {} n.disconnect(); });
  testNodes = [];
}
async function startMic() {
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
      throw new Error("Браузер не даёт доступ к микрофону. Откройте страницу через http://localhost (python3 -m http.server), а не как файл.");
    await ensureContext();
    disconnectSources();
    const id = $("dev").value;
    stream = await navigator.mediaDevices.getUserMedia({ audio: {
      deviceId: id ? { exact: id } : undefined,
      echoCancellation: false, noiseSuppression: false, autoGainControl: false,
    }});
    srcNode = ac.createMediaStreamSource(stream);
    srcNode.connect(analyser);
    mode = "mic";
    const track = stream.getAudioTracks()[0];
    showMsg("");
    await listDevices(track && track.getSettings().deviceId);
    setRunning();
  } catch (e) {
    mode = null; setRunning();
    showMsg("Не удалось открыть вход: " + (e.message || e.name), true);
  }
}
// Тестовый сигнал: пила ~600 Гц с вибрато и медленным глиссандо — похоже на "ку-ка-ре-ку" из скетча.
async function startTest() {
  await ensureContext();
  disconnectSources();
  const osc = ac.createOscillator(); osc.type = "sawtooth"; osc.frequency.value = 600;
  const vib = ac.createOscillator(); vib.frequency.value = 6;
  const vibDepth = ac.createGain(); vibDepth.gain.value = 8;
  const glide = ac.createOscillator(); glide.type = "triangle"; glide.frequency.value = 0.4;
  const glideDepth = ac.createGain(); glideDepth.gain.value = 150;
  const lvl = ac.createGain(); lvl.gain.value = 0.25;
  vib.connect(vibDepth).connect(osc.frequency);
  glide.connect(glideDepth).connect(osc.frequency);
  osc.connect(lvl).connect(analyser);
  [osc, vib, glide].forEach(o => o.start());
  testNodes = [osc, vib, vibDepth, glide, glideDepth, lvl];
  mode = "test"; showMsg(""); setRunning();
}
function stopAll() {
  disconnectSources(); mode = null; setRunning();
}
function setRunning() {
  $("start").textContent = mode === "mic" ? "Стоп" : "Старт";
  $("test").setAttribute("aria-pressed", mode === "test" ? "true" : "false");
  updateStatus();
}
function updateStatus() {
  if (!mode || !analyser) { $("status").textContent = "остановлено"; return; }
  const n = analyser.fftSize;
  $("status").textContent = (mode === "test" ? "тест-сигнал" : "вход") +
    ` · ${sr()} Гц · БПФ ${n} · окно ${(n / sr() * 1000).toFixed(0)} мс`;
  $("sSr").innerHTML = (sr() / 1000).toFixed(1) + '<span class="u">кГц</span>';
  $("sRes").innerHTML = (sr() / n).toFixed(1) + '<span class="u">Гц/бин</span>';
}
async function listDevices(selectId) {
  if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return;
  const sel = $("dev"), keep = selectId || sel.value;
  const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "audioinput");
  sel.innerHTML = '<option value="">по умолчанию</option>' +
    devs.filter(d => d.deviceId && d.deviceId !== "default")
        .map((d, i) => `<option value="${d.deviceId}">${(d.label || "Вход " + (i + 1)).replace(/</g, "&lt;")}</option>`).join("");
  if ([...sel.options].some(o => o.value === keep)) sel.value = keep;
}

// ---------- анализ ----------
function analyseLevel(buf) {
  let sum = 0, pk = 0, dc = 0, zc = 0;
  for (let i = 0; i < buf.length; i++) {
    const v = buf[i]; sum += v * v; dc += v;
    const a = v < 0 ? -v : v; if (a > pk) pk = a;
    if (i && (buf[i - 1] < 0) !== (v < 0)) zc++;
  }
  const rms = Math.sqrt(sum / buf.length);
  return {
    rmsDb: rms > 1e-7 ? 20 * Math.log10(rms) : -140,
    pkDb: pk > 1e-7 ? 20 * Math.log10(pk) : -140,
    pk, dc: dc / buf.length,
    zcr: zc / 2 / (buf.length / sr()),
  };
}

// YIN: основной тон по нормированной разностной функции
let yinD = new Float32Array(0);
function yin(buf, rate) {
  const tauMin = Math.floor(rate / 2000);
  let tauMax = Math.floor(rate / 60);
  const W = Math.min(2048, Math.floor(buf.length / 2));
  tauMax = Math.min(tauMax, buf.length - W - 1);
  if (tauMax <= tauMin + 2) return { f: 0, conf: 0 };
  if (yinD.length < tauMax + 2) yinD = new Float32Array(tauMax + 2);
  const d = yinD;
  d[0] = 1;
  let run = 0;
  for (let tau = 1; tau <= tauMax + 1; tau++) {
    let s = 0;
    for (let j = 0; j < W; j++) { const x = buf[j] - buf[j + tau]; s += x * x; }
    run += s;
    d[tau] = run > 0 ? s * tau / run : 1;
  }
  let tau = -1;
  for (let t = tauMin; t <= tauMax; t++) {
    if (d[t] < 0.15) { while (t + 1 <= tauMax && d[t + 1] < d[t]) t++; tau = t; break; }
  }
  if (tau < 0) return { f: 0, conf: 0 };
  const a = d[tau - 1], b = d[tau], c = d[tau + 1];
  const den = a + c - 2 * b;
  const shift = den !== 0 ? 0.5 * (a - c) / den : 0;
  return { f: rate / (tau + shift), conf: 1 - b };
}

function analyseSpectrum(spec) {
  const binHz = sr() / analyser.fftSize;
  const b0 = Math.max(1, Math.ceil(30 / binHz)), b1 = Math.min(spec.length - 2, Math.floor(fMax() / binHz));
  let best = b0, num = 0, den = 0;
  for (let b = b0; b <= b1; b++) {
    const db = spec[b];
    if (db > spec[best]) best = b;
    const p = Math.pow(10, db / 10);
    num += p * b * binHz; den += p;
  }
  const a = spec[best - 1], m = spec[best], c = spec[best + 1];
  const dd = a + c - 2 * m;
  const shift = dd !== 0 ? 0.5 * (a - c) / dd : 0;
  return { dom: (best + shift) * binHz, domDb: m, centroid: den > 0 ? num / den : 0 };
}

// ---------- спектрограмма ----------
let specMap = null, specCol = null, specColW = 1;
function buildSpecMap(h) {
  const binHz = sr() / analyser.fftSize, maxBin = freqBuf.length - 1;
  specMap = { h, lo: new Int32Array(h), hi: new Int32Array(h), frac: new Float32Array(h) };
  for (let y = 0; y < h; y++) {
    const fTop = nToF(1 - y / h), fBot = nToF(1 - (y + 1) / h), fMid = nToF(1 - (y + 0.5) / h);
    const lo = Math.floor(fBot / binHz), hi = Math.floor(fTop / binHz);
    if (hi > lo) {               // несколько бинов на пиксель: берём максимум
      specMap.lo[y] = Math.min(maxBin, lo + 1); specMap.hi[y] = Math.min(maxBin, hi); specMap.frac[y] = -1;
    } else {                     // один бин на несколько пикселей: интерполяция
      const x = fMid / binHz, b = Math.min(maxBin - 1, Math.floor(x));
      specMap.lo[y] = b; specMap.hi[y] = b + 1; specMap.frac[y] = x - b;
    }
  }
  specColW = Math.max(1, Math.round(dpr()));
  specCol = new ImageData(specColW, h);
}
function drawSpecColumn(c, g) {
  if (!specMap || specMap.h !== c.height) buildSpecMap(c.height);
  const h = c.height, w = c.width, data = specCol.data, range = dbMax - dbMin;
  for (let y = 0; y < h; y++) {
    let v;
    if (specMap.frac[y] < 0) {
      v = -200; for (let b = specMap.lo[y]; b <= specMap.hi[y]; b++) if (freqBuf[b] > v) v = freqBuf[b];
    } else {
      const f = specMap.frac[y]; v = freqBuf[specMap.lo[y]] * (1 - f) + freqBuf[specMap.hi[y]] * f;
    }
    let k = Math.round((v - dbMin) / range * 255); k = k < 0 ? 0 : k > 255 ? 255 : k;
    for (let x = 0; x < specColW; x++) {
      const o = (y * specColW + x) * 4;
      data[o] = LUT[k*3]; data[o+1] = LUT[k*3+1]; data[o+2] = LUT[k*3+2]; data[o+3] = 255;
    }
  }
  // новые данные слева, картинка едет вправо
  g.drawImage(c, specColW, 0);
  g.putImageData(specCol, 0, 0);
}
function drawSpecAxes() {
  const c = $("specAxes"); fit(c);
  const g = c.getContext("2d"), d = dpr(), w = c.width, h = c.height;
  g.clearRect(0, 0, w, h);
  g.font = `${11 * d}px ${getComputedStyle(document.body).getPropertyValue("--mono")}`;
  g.textBaseline = "middle";
  for (const f of freqTicks()) {
    const y = Math.round((1 - fToN(f)) * h) + 0.5;
    g.strokeStyle = "rgba(255,255,255,0.12)"; g.lineWidth = 1;
    g.beginPath(); g.moveTo(0, y); g.lineTo(w - 40 * d, y); g.stroke();
    // подписи справа, чтобы не закрывать свежие данные у левого края
    const t = tickLabel(f), tw = g.measureText(t).width;
    g.fillStyle = "rgba(0,0,0,0.55)"; g.fillRect(w - tw - 10 * d, y - 8 * d, tw + 8 * d, 16 * d);
    g.fillStyle = "#cfd6df"; g.fillText(t, w - tw - 6 * d, y);
  }
  const secs = (c.getBoundingClientRect().width * d / specColW) / SPEC_RATE;
  $("specInfo").textContent = `${secs.toFixed(0)} с на экран · ${dbMin}…${dbMax} дБ`;
}

// ---------- спектр ----------
function drawSpectrum() {
  const c = $("spectrum"); fit(c);
  const g = c.getContext("2d"), w = c.width, h = c.height, d = dpr();
  g.clearRect(0, 0, w, h);
  const yOf = (db) => (1 - (db - dbMin) / (dbMax - dbMin)) * h;
  g.font = `${10 * d}px ui-monospace, Menlo, monospace`; g.fillStyle = "#7d8794";
  g.strokeStyle = "rgba(255,255,255,0.07)"; g.lineWidth = 1;
  for (let db = Math.ceil(dbMin / 20) * 20; db <= dbMax; db += 20) {
    const y = Math.round(yOf(db)) + 0.5;
    g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke();
    g.fillText(db + " дБ", 4 * d, y - 3 * d);
  }
  for (const f of freqTicks()) {
    const x = Math.round(fToN(f) * w) + 0.5;
    g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke();
    g.fillText(tickLabel(f), x + 3 * d, h - 4 * d);
  }
  const binHz = sr() / analyser.fftSize;
  const curve = (arr, color, width) => {
    g.strokeStyle = color; g.lineWidth = width * d; g.beginPath();
    let started = false;
    for (let px = 0; px < w; px += 1) {
      const fa = nToF(px / w), fb = nToF((px + 1) / w);
      const ba = Math.max(1, Math.floor(fa / binHz)), bb = Math.min(arr.length - 1, Math.max(ba, Math.floor(fb / binHz)));
      let v = -200; for (let b = ba; b <= bb; b++) if (arr[b] > v) v = arr[b];
      const y = Math.min(h, Math.max(0, yOf(v)));
      if (!started) { g.moveTo(px, y); started = true; } else g.lineTo(px, y);
    }
    g.stroke();
  };
  curve(peakSpec, "rgba(246,173,85,0.75)", 1);
  curve(freqBuf, "#4fd1c5", 1.5);
}

// ---------- осциллограмма ----------
function drawScope(lv) {
  const c = $("scope"); fit(c);
  const g = c.getContext("2d"), w = c.width, h = c.height, d = dpr();
  g.clearRect(0, 0, w, h);
  g.strokeStyle = "rgba(255,255,255,0.07)"; g.lineWidth = 1;
  for (let i = 1; i < 10; i++) { const x = Math.round(i * w / 10) + 0.5; g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); }
  for (let i = 1; i < 4; i++) { const y = Math.round(i * h / 4) + 0.5; g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }

  const span = Math.min(timeBuf.length >> 1, Math.round(sr() * 0.02));   // 20 мс на экран
  // Автомасштаб по вертикали, чтобы тихий микрофонный сигнал было видно
  const target = Math.min(200, 0.85 / Math.max(lv.pk, 1e-4));
  scopeGain += (target - scopeGain) * (target < scopeGain ? 0.5 : 0.05);
  // Триггер: переход через ноль вверх после ухода ниже -10% пика
  let trig = 0, armed = false; const thr = -0.1 * lv.pk;
  for (let i = 1; i < timeBuf.length - span; i++) {
    if (timeBuf[i] < thr) armed = true;
    if (armed && timeBuf[i - 1] <= 0 && timeBuf[i] > 0) { trig = i; break; }
  }
  g.strokeStyle = "#4fd1c5"; g.lineWidth = 1.5 * d; g.beginPath();
  for (let i = 0; i < span; i++) {
    const x = i / (span - 1) * w, y = h / 2 - timeBuf[trig + i] * scopeGain * h / 2;
    i ? g.lineTo(x, y) : g.moveTo(x, y);
  }
  g.stroke();
  $("scopeInfo").textContent = `20 мс · 2 мс/дел · ×${scopeGain.toFixed(scopeGain < 10 ? 1 : 0)}`;
}

// ---------- история ----------
function drawLevelHist() {
  const c = $("levelHist"); fit(c);
  const g = c.getContext("2d"), w = c.width, h = c.height, d = dpr();
  g.clearRect(0, 0, w, h);
  const lo = -90, hi = 0, yOf = (db) => (1 - (Math.max(lo, db) - lo) / (hi - lo)) * h;
  g.font = `${10 * d}px ui-monospace, Menlo, monospace`; g.fillStyle = "#7d8794";
  g.strokeStyle = "rgba(255,255,255,0.07)"; g.lineWidth = 1;
  for (let db = -80; db <= 0; db += 20) {
    const y = Math.round(yOf(db)) + 0.5; g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke();
    g.textAlign = "right"; g.fillText(db + " дБ", w - 4 * d, y + 11 * d); g.textAlign = "left";
  }
  // новые точки слева, график едет вправо
  g.beginPath(); g.moveTo(w, h);
  for (let i = 0; i < HIST_LEN; i++) g.lineTo((1 - i / (HIST_LEN - 1)) * w, yOf(levelHist[(histPos + i) % HIST_LEN]));
  g.lineTo(0, h); g.closePath();
  g.fillStyle = "rgba(79,209,197,0.25)"; g.fill();
  g.strokeStyle = "#4fd1c5"; g.lineWidth = 1.2 * d; g.stroke();
  g.fillStyle = "#7d8794"; g.fillText("RMS, последние 10 с", 4 * d, 12 * d);
}
function drawPitchHist() {
  const c = $("pitchHist"); fit(c);
  const g = c.getContext("2d"), w = c.width, h = c.height, d = dpr();
  g.clearRect(0, 0, w, h);
  const lo = 60, hi = 2000, yOf = (f) => (1 - Math.log(f / lo) / Math.log(hi / lo)) * h;
  g.font = `${10 * d}px ui-monospace, Menlo, monospace`; g.fillStyle = "#7d8794";
  g.strokeStyle = "rgba(255,255,255,0.07)"; g.lineWidth = 1;
  for (const f of [100, 200, 500, 1000]) {
    const y = Math.round(yOf(f)) + 0.5; g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke();
    g.textAlign = "right"; g.fillText(tickLabel(f), w - 4 * d, y - 3 * d); g.textAlign = "left";
  }
  g.fillStyle = "#f6ad55";
  const r = 1.5 * d;
  for (let i = 0; i < HIST_LEN; i++) {
    const f = pitchHist[(histPos + i) % HIST_LEN];
    if (f > 0) g.fillRect((1 - i / (HIST_LEN - 1)) * w - r, yOf(f) - r, 2 * r, 2 * r);
  }
  g.fillStyle = "#7d8794"; g.fillText("тон, последние 10 с", 4 * d, 12 * d);
}

// ---------- индикаторы ----------
const pct = (db) => Math.max(0, Math.min(100, (db + 90) / 90 * 100));
function updateMeters(lv, now) {
  rmsHoldDb = Math.max(lv.rmsDb, rmsHoldDb - 0.3);
  pkHoldDb = Math.max(lv.pkDb, pkHoldDb - 0.3);
  if (lv.pk >= 0.99) clipUntil = now + 1500;
  $("rmsFill").style.width = pct(lv.rmsDb) + "%"; $("rmsHold").style.left = pct(rmsHoldDb) + "%";
  $("pkFill").style.width = pct(lv.pkDb) + "%";   $("pkHold").style.left = pct(pkHoldDb) + "%";
  $("rmsVal").textContent = lv.rmsDb > -139 ? lv.rmsDb.toFixed(1) + " dBFS" : "—";
  $("pkVal").textContent = lv.pkDb > -139 ? lv.pkDb.toFixed(1) + " dBFS" : "—";
  $("clip").className = now < clipUntil ? "on" : "";
  $("sDc").innerHTML = (lv.dc * 100).toFixed(2) + '<span class="u">% FS</span>';
  $("sZcr").innerHTML = lv.rmsDb > GATE_DB ? fmtHz(lv.zcr) : "—";
}
function updateTuner(f) {
  if (!f) { $("note").textContent = "—"; $("cents").textContent = ""; $("hz").textContent = ""; $("needle").style.opacity = 0.25; return; }
  const midi = 69 + 12 * Math.log2(f / 440), n = Math.round(midi), cents = Math.round((midi - n) * 100);
  $("note").textContent = NOTES[((n % 12) + 12) % 12] + (Math.floor(n / 12) - 1);
  $("cents").textContent = (cents > 0 ? "+" : "") + cents + " ¢";
  $("cents").style.color = Math.abs(cents) <= 5 ? "var(--accent)" : "var(--peak)";
  $("hz").textContent = f.toFixed(1) + " Гц";
  $("needle").style.left = (50 + cents) + "%"; $("needle").style.opacity = 1;
}

// ---------- главный цикл ----------
function frame(now) {
  requestAnimationFrame(frame);
  if (!analyser || !mode || frozen) { lastSpec = lastHist = now; return; }

  analyser.getFloatTimeDomainData(timeBuf);
  analyser.getFloatFrequencyData(freqBuf);
  for (let i = 0; i < freqBuf.length; i++) {
    if (!isFinite(freqBuf[i])) freqBuf[i] = -200;
    peakSpec[i] = Math.max(freqBuf[i], peakSpec[i] - 0.4);
  }

  const lv = analyseLevel(timeBuf);
  const sp = analyseSpectrum(freqBuf);
  const voiced = lv.rmsDb > GATE_DB;
  const p = voiced ? yin(timeBuf, sr()) : { f: 0 };

  // спектрограмма: фиксированная скорость прокрутки, независимо от частоты кадров экрана
  const sc = $("spec"); if (fit(sc)) { specMap = null; drawSpecAxes(); }
  const g = sc.getContext("2d");
  let cols = Math.floor((now - lastSpec) * SPEC_RATE / 1000);
  if (cols > 0) { lastSpec += cols * 1000 / SPEC_RATE; cols = Math.min(cols, 4); for (let i = 0; i < cols; i++) drawSpecColumn(sc, g); }

  let pts = Math.floor((now - lastHist) * HIST_RATE / 1000);
  if (pts > 0) {
    lastHist += pts * 1000 / HIST_RATE;
    for (let i = 0; i < Math.min(pts, HIST_LEN); i++) {
      levelHist[histPos] = lv.rmsDb; pitchHist[histPos] = p.f; histPos = (histPos + 1) % HIST_LEN;
    }
  }

  drawSpectrum();
  drawScope(lv);
  drawLevelHist();
  drawPitchHist();
  updateMeters(lv, now);
  updateTuner(p.f);
  $("sDom").innerHTML = voiced ? fmtHz(sp.dom) : "—";
  $("sCent").innerHTML = voiced ? fmtHz(sp.centroid) : "—";
}

// ---------- управление ----------
function readSettings() {
  logScale = $("scale").value === "log";
  fMaxUser = +$("fmax").value;
  dbMin = +$("dbmin").value; dbMax = +$("dbmax").value;
  if (dbMax <= dbMin + 10) { dbMax = dbMin + 10; $("dbmax").value = dbMax; }
  specMap = null;
  const sc = $("spec"); sc.getContext("2d").clearRect(0, 0, sc.width, sc.height);
  drawSpecAxes();
}
$("start").onclick = () => (mode === "mic" ? stopAll() : startMic());
$("test").onclick = () => (mode === "test" ? stopAll() : startTest());
$("freeze").onclick = () => { frozen = !frozen; $("freeze").setAttribute("aria-pressed", String(frozen)); };
$("dev").onchange = () => { if (mode === "mic") startMic(); };
$("fft").onchange = () => { setFft(+$("fft").value); readSettings(); };
["scale", "fmax", "dbmin", "dbmax"].forEach(id => $(id).onchange = readSettings);
document.addEventListener("keydown", (e) => {
  if (e.code === "Space" && !/INPUT|SELECT|BUTTON/.test(e.target.tagName)) { e.preventDefault(); $("freeze").click(); }
});
$("shot").onclick = () => {
  const a = $("spec"), b = $("specAxes"), out = document.createElement("canvas");
  out.width = a.width; out.height = a.height;
  const g = out.getContext("2d"); g.drawImage(a, 0, 0); g.drawImage(b, 0, 0);
  out.toBlob((blob) => {
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "spectrogram-" + new Date().toISOString().replace(/[:.]/g, "-") + ".png";
    link.click(); setTimeout(() => URL.revokeObjectURL(link.href), 1000);
  });
};
window.addEventListener("resize", () => { specMap = null; drawSpecAxes(); });
if (navigator.mediaDevices && navigator.mediaDevices.addEventListener)
  navigator.mediaDevices.addEventListener("devicechange", () => listDevices());

if (!window.isSecureContext)
  showMsg("Страница открыта не через localhost/https — браузер не даст доступ к микрофону. " +
          "Запустите в папке со страницей: <code>python3 -m http.server</code> и откройте <code>http://localhost:8000</code>. " +
          "Кнопка «Тест-сигнал» работает и так.", true);

listDevices();
drawSpecAxes();
requestAnimationFrame(frame);

// ?test — сразу включить тест-сигнал, ?mic — сразу открыть вход (для отладки)
const qs = new URLSearchParams(location.search);
if (qs.has("test")) startTest();
else if (qs.has("mic")) startMic();
</script>
</body>
</html>
